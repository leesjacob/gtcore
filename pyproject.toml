[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gtcore"
version = "0.1.0"
description = "IntraOp GammaTile: CT reconstruction, seed localization, tile characterization, and TG-43U1 dosimetry core"
# 3.11 / 3.12 only: pymedphys (the `clinical` extra) declares <3.13 and its
# dependency tree does not import on 3.13.
requires-python = ">=3.11,<3.13"
authors = [{ name = "Jacob Lee" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "SimpleITK>=2.2",
    "pydicom>=2.4",
    "trimesh>=4.0",
    # trimesh's spatial index (proximity.closest_point, contains, ray queries);
    # trimesh lists it only under its `easy` extra and 169 tests error without it.
    "rtree>=1.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Phase 3 clinical comparison: pymedphys.gamma (3 %/2 mm, 2 %/1 mm) and numba,
# pymedphys' default interpolation backend (gamma(..., interp_algo="scipy")
# runs without numba).  pymedphys' own numpy/scipy requirements are unpinned.
clinical = ["pymedphys>=0.41", "numba>=0.60"]
viz = ["pyvista"]

[project.scripts]
gt = "gtcore.cli:main"

[tool.setuptools.packages.find]
include = ["gtcore*"]

[tool.setuptools.package-data]
# Engine QA fixtures (Phase 3 `engine-qa`): TG-43U1S2 consensus tables as
# embedded in Paper 1's engine + the erratum-corrected QA dose-rate table.
"gtcore.dose.qa_data" = ["*.json", "*.csv"]
